<!DOCTYPE html>
<html lang="es" data-theme="guardian">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
  <title>SENTINEL — ELVIS SYSTEMS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Sora:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <style>
    /* ============================================================
       PREMIUM HUD — pulido by ELVIS SYSTEMS (no toca la bola)
       ============================================================ */
    :root { --hair2: rgba(120,255,210,.24); --glassA: rgba(18,48,38,.62); --glassB: rgba(7,22,16,.85); }

    /* Botones de herramientas (arriba-izq) — vidrio con profundidad */
    .tools { gap: 11px; top: 20px; left: 22px; }
    .tool {
      width: 40px; height: 40px; border-radius: 50%;
      background: linear-gradient(160deg, rgba(30,50,74,.55), rgba(10,18,30,.6));
      border: 1px solid var(--hair2);
      box-shadow: inset 0 1px 0 rgba(255,255,255,.07), 0 5px 16px rgba(0,0,0,.4);
      transition: transform .14s, border-color .16s, box-shadow .18s, background .16s;
    }
    .tool:hover {
      transform: translateY(-3px);
      border-color: var(--pri);
      background: linear-gradient(160deg, color-mix(in srgb, var(--pri) 24%, transparent), rgba(10,18,30,.6));
      box-shadow: 0 0 20px var(--glow), inset 0 1px 0 rgba(255,255,255,.12);
    }

    /* Reloj — más imponente */
    .clock-time { font-size: 30px; font-weight: 600; letter-spacing: 3px; color: #eaf6ff; text-shadow: 0 0 20px var(--glow); }
    .clock-date { font-size: 10.5px; letter-spacing: 2.5px; opacity: .5; }
    .winbtn { border-radius: 9px; }

    /* Caption — pastilla de estado limpia */
    .caption {
      padding: 7px 20px; border-radius: 999px; font-size: 11px; letter-spacing: .32em;
      background: linear-gradient(180deg, var(--glassA), var(--glassB));
      border: 1px solid var(--hair2);
      box-shadow: 0 6px 22px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.06);
    }
    .dots { opacity: .22; }

    /* Dropzone — sutil y elegante (pastilla con borde punteado) */
    .dropzone {
      bottom: 160px; min-width: auto; padding: 9px 22px; border-radius: 999px;
      background: rgba(12,22,36,.42); border: 1px dashed var(--hair2);
      font-size: 11px; opacity: .78;
    }
    .dropzone:hover, .dropzone.drag { opacity: 1; }

    /* Respuesta hablada: TARJETA legible (texto completo, multilínea). */
    .response {
      font-size: 18px; line-height: 1.55; font-weight: 600; color: #eaf6ff;
      text-shadow: 0 1px 6px rgba(0,0,0,.85);
      white-space: normal; overflow: visible; text-overflow: clip;
      width: auto; max-width: min(740px, 84%);
      bottom: 122px; text-align: center;
      padding: 16px 26px; border-radius: 18px;
      background: linear-gradient(180deg, rgba(12,20,34,.86), rgba(6,10,18,.93));
      border: 1px solid var(--hair2);
      box-shadow: 0 18px 55px rgba(0,0,0,.65), 0 0 24px rgba(47,230,168,.10), inset 0 1px 0 rgba(255,255,255,.07);
    }
    .response:empty { display: none; }   /* sin texto → sin tarjeta */

    /* Atenuar la bola y el resto cuando HABLA, para que el texto resalte */
    #sphere-canvas { transition: opacity .45s ease; }
    body.speaking #sphere-canvas { opacity: .5; }
    body.speaking .response {
      border-color: var(--pri);
      box-shadow: 0 18px 55px rgba(0,0,0,.7), 0 0 34px rgba(47,230,168,.22), inset 0 1px 0 rgba(255,255,255,.08);
    }

    /* Barra de comandos — CÁPSULA flotante premium (centrada) */
    .cmdbar {
      left: 50%; right: auto; transform: translateX(-50%);
      width: min(900px, calc(100% - 36px));
      gap: 11px; padding: 11px 16px; border-radius: 22px;
      background: linear-gradient(180deg, rgba(18,30,48,.74), rgba(6,11,20,.88));
      border: 1px solid var(--hair2);
      box-shadow: 0 20px 55px rgba(0,0,0,.6), 0 0 30px rgba(47,230,168,.10), inset 0 1px 0 rgba(255,255,255,.08);
    }
    .mic { width: 46px; height: 46px; box-shadow: 0 0 18px var(--glow), inset 0 0 14px rgba(47,230,168,.18); }
    .round-btn {
      background: linear-gradient(160deg, rgba(28,44,66,.55), rgba(10,18,30,.55));
      border: 1px solid var(--hair2);
      transition: transform .14s, border-color .16s, box-shadow .18s, background .16s, color .16s, filter .16s;
    }
    .round-btn:hover { transform: translateY(-3px); border-color: var(--pri); box-shadow: 0 0 18px var(--glow); }
    .round-btn.send {
      background: linear-gradient(160deg, var(--pri), #0a93cb);
      box-shadow: 0 0 22px var(--glow), inset 0 1px 0 rgba(255,255,255,.35);
    }
    .cmd-input {
      border-radius: 14px; padding: 12px 18px;
      background: rgba(0,0,0,.42); border: 1px solid var(--hair2);
    }
    .cmd-input input { font-size: 13.5px; }

    /* ===== Modo LIMPIO: controles ocultos hasta "activar teclado" =====
       Por defecto solo se ve la bola. La barra de comandos, los botones de
       funciones y la dropzone aparecen cuando el usuario lo pide. */
    .tools { transition: opacity .35s ease, transform .35s ease; }
    .dropzone { transition: opacity .3s ease, transform .35s ease; }
    .cmdbar { transition: opacity .35s ease, transform .4s cubic-bezier(.2,.8,.2,1); }
    body:not(.controls-on) .tools { opacity: 0; pointer-events: none; transform: translateY(-14px); }
    body:not(.controls-on) .dropzone { opacity: 0; pointer-events: none; transform: translate(-50%, 14px); }
    body:not(.controls-on) .cmdbar { opacity: 0; pointer-events: none; transform: translate(-50%, 150%); }

    /* ===== Panel de subida de archivo ===== */
    .upload-panel {
      position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%);
      width: min(440px, 86vw); padding: 34px 30px; text-align: center; z-index: 60;
      display: flex; flex-direction: column; align-items: center; gap: 11px;
      background: linear-gradient(180deg, rgba(16,28,46,.96), rgba(7,12,22,.98));
      border: 1.5px solid var(--pri); border-radius: 22px;
      box-shadow: 0 26px 70px rgba(0,0,0,.72), 0 0 32px var(--glow);
      animation: upIn .2s ease-out;
    }
    .upload-panel[hidden] { display: none; }
    @keyframes upIn { from{opacity:0; transform:translate(-50%,-46%);} to{opacity:1; transform:translate(-50%,-50%);} }
    .upload-close { position: absolute; top: 12px; right: 12px; background: transparent; border: none; color: var(--text); opacity: .55; cursor: pointer; padding: 4px; }
    .upload-close:hover { opacity: 1; }
    .upload-icon { width: 66px; height: 66px; border-radius: 50%; display: grid; place-items: center; color: var(--pri);
      background: radial-gradient(circle, color-mix(in srgb, var(--pri) 22%, transparent), transparent 70%);
      border: 1px solid var(--hair2); box-shadow: inset 0 0 18px rgba(47,230,168,.15); }
    .upload-icon .ico svg { width: 28px; height: 28px; }
    .upload-title { font-size: 18px; font-weight: 700; color: #eaf6ff; }
    .upload-sub { font-size: 12px; color: var(--text); opacity: .6; font-family: "JetBrains Mono", monospace; }
    .upload-btn { margin-top: 8px; padding: 11px 28px; border-radius: 13px; cursor: pointer; font-weight: 600; font-size: 14px;
      color: #03121a; border: none; background: linear-gradient(160deg, #5fffd0, var(--pri));
      box-shadow: 0 8px 24px var(--glow); transition: transform .14s, filter .14s; }
    .upload-btn:hover { transform: translateY(-2px); filter: brightness(1.1); }
    .upload-panel.drag { border-color: #7fe6ff; box-shadow: 0 26px 70px rgba(0,0,0,.72), 0 0 46px var(--pri); }

    /* ===== Chat panel (modo teclado, estilo Claude Code) ===== */
    .chat-panel{
      position:absolute; top:74px; left:50%; transform:translateX(-50%);
      width:min(760px,92vw); height:min(64vh,560px);
      display:flex; flex-direction:column;
      background:#070c13;                 /* SÓLIDO: nada se transparenta detrás */
      border:1.5px solid var(--pri);
      border-radius:16px;
      box-shadow:0 18px 70px rgba(0,0,0,.85), 0 0 26px var(--glow);
      z-index:50; overflow:hidden;
      animation:chatIn .18s ease-out;
    }
    .chat-panel[hidden]{ display:none; }
    @keyframes chatIn{ from{opacity:0; transform:translateX(-50%) translateY(-8px);} to{opacity:1; transform:translateX(-50%) translateY(0);} }
    .chat-head{
      display:flex; align-items:center; justify-content:space-between;
      padding:10px 14px; border-bottom:1px solid var(--hair);
      font-family:"JetBrains Mono",monospace; letter-spacing:.12em;
    }
    .chat-title{ color:var(--pri); font-size:12px; font-weight:700; }
    .chat-title .dot{ display:inline-block; width:7px; height:7px; border-radius:50%; background:var(--pri); margin-right:8px; box-shadow:0 0 8px var(--pri); }
    .chat-close{ background:transparent; border:none; color:var(--text); cursor:pointer; opacity:.7; padding:4px; }
    .chat-close:hover{ opacity:1; }
    .chat-head{ background:linear-gradient(180deg, rgba(18,30,48,.9), rgba(8,14,24,.95)); }
    .chat-log{ flex:1; overflow-y:auto; padding:18px; display:flex; flex-direction:column; gap:14px;
      background:radial-gradient(120% 80% at 50% 0%, rgba(20,34,54,.35), transparent 60%), #070c13; }
    .chat-log::-webkit-scrollbar{ width:8px; } .chat-log::-webkit-scrollbar-thumb{ background:var(--pri-dim); border-radius:8px; }
    .msg{ max-width:80%; padding:11px 15px; border-radius:16px; font-size:14px; line-height:1.55; white-space:pre-wrap; word-wrap:break-word;
      box-shadow:0 6px 18px rgba(0,0,0,.4); animation:msgIn .22s ease-out; }
    @keyframes msgIn{ from{opacity:0; transform:translateY(8px);} to{opacity:1; transform:translateY(0);} }
    .msg.user{ align-self:flex-end; color:#03121a; font-weight:600; border-bottom-right-radius:4px;
      background:linear-gradient(160deg, #5fffd0, var(--pri)); box-shadow:0 6px 20px rgba(47,230,168,.28); }
    .msg.bot{ align-self:flex-start; color:#eaf6ff; border-bottom-left-radius:4px;
      background:linear-gradient(165deg, rgba(28,44,66,.92), rgba(14,22,36,.95));
      border:1px solid var(--hair2); box-shadow:0 6px 18px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.05); }
    .msg .who{ display:block; font-size:9.5px; letter-spacing:.14em; opacity:.55; margin-bottom:4px; font-family:"JetBrains Mono",monospace; text-transform:uppercase; }
    .chat-empty{ margin:auto; color:var(--text); opacity:.45; font-size:13px; text-align:center; }
    body.chat-on .cmd-input{ box-shadow:0 0 0 2px var(--pri), 0 0 14px var(--glow); border-radius:12px; }
  </style>
</head>
<body>
  <div class="hud">

    <!-- ===== Top-left tool buttons ===== -->
    <div class="tools">
      <button class="tool" id="btnSettings" title="Ajustes"><span class="ico" data-icon="settings"></span></button>
      <button class="tool" id="btnTerminal" title="Terminal"><span class="ico" data-icon="terminal"></span></button>
      <button class="tool" id="btnFolder" title="Carpeta"><span class="ico" data-icon="folder"></span></button>
      <button class="tool tool-wa" id="btnWhatsapp" title="WhatsApp"><span class="ico" data-icon="whatsapp"></span></button>
    </div>

    <!-- ===== Top-right: window controls + clock ===== -->
    <div class="topright">
      <div class="winctl">
        <button class="winbtn" id="btnTheme" title="Tema"><span class="ico" data-icon="palette"></span></button>
        <button class="winbtn" id="btnMin" title="Minimizar"><span class="ico" data-icon="minimize"></span></button>
        <button class="winbtn" id="btnMax" title="Maximizar"><span class="ico" data-icon="maximize"></span></button>
        <button class="winbtn winbtn-close" id="btnClose" title="Cerrar"><span class="ico" data-icon="close"></span></button>
      </div>
      <div class="clock">
        <div class="clock-time" id="clockTime">--:--:--</div>
        <div class="clock-date" id="clockDate">—</div>
      </div>
    </div>

    <!-- ===== Central neural orb ===== -->
    <div class="orb-stage" id="orbWrapper">
      <canvas id="sphere-canvas"></canvas>
      <div class="ambient-halo" id="ambient-halo"></div>
    </div>

    <!-- ===== Caption under orb ===== -->
    <div class="caption-wrap">
      <div class="dots"></div>
      <div class="caption" id="orbCaption" data-state="LISTENING">
        <span class="cap-dot"></span><span id="capTxt">VIGILANDO</span>
      </div>
    </div>

    <!-- ===== File drop zone ===== -->
    <div class="dropzone" id="dropzone">
      <span class="ico" data-icon="attach"></span>
      <span>Arrastrá un archivo o hacé clic</span>
    </div>

    <!-- ===== Response / subtitle line ===== -->
    <div class="response" id="response">SENTINEL en línea. Sistema protegido.</div>

    <!-- ===== Bottom command bar ===== -->
    <div class="cmdbar">
      <button class="mic listening" id="micToggle" aria-pressed="false" title="Escuchando — clic para silenciar">
        <span class="ico" id="micIcon" data-icon="mic"></span>
      </button>
      <button class="round-btn" id="camBtn" title="Cámara / Visión"><span class="ico" data-icon="camera"></span></button>

      <div class="cmd-input">
        <input id="textInput" type="text" placeholder="Pregúntale a SENTINEL…" autocomplete="off" aria-label="Mensaje" />
      </div>

      <button class="round-btn send" id="sendBtn" title="Enviar"><span class="ico" data-icon="send"></span></button>
      <button class="round-btn" id="exitBtn" title="Salir"><span class="ico" data-icon="logout"></span></button>
      <button class="round-btn" id="fsBtn" title="Pantalla completa"><span class="ico" data-icon="fullscreen"></span></button>
      <button class="round-btn stop" id="stopBtn" title="Detener"><span class="ico" data-icon="stop"></span></button>
    </div>

    <!-- ===== In-app camera panel ===== -->
    <div class="campreview" id="campreview" hidden>
      <div class="cam-head">
        <span class="cam-tag"><span class="cam-rec"></span>CÁMARA</span>
        <button class="cam-close" id="camClose" title="Cerrar cámara"><span class="ico" data-icon="close"></span></button>
      </div>
      <img id="camImg" alt="cámara" />
      <video id="camVideo" autoplay muted playsinline hidden></video>
    </div>

    <!-- ===== Chat panel (se abre con "activar teclado") ===== -->
    <div class="chat-panel" id="chatPanel" hidden>
      <div class="chat-head">
        <span class="chat-title"><span class="dot"></span>CHAT — SENTINEL</span>
        <button class="chat-close" id="chatClose" title="Cerrar chat"><span class="ico" data-icon="close"></span></button>
      </div>
      <div class="chat-log" id="chatLog">
        <div class="chat-empty" id="chatEmpty">Escribí abajo y presioná Enter. Decí «desactivar teclado» para cerrar.</div>
      </div>
    </div>

    <!-- ===== Panel de subida de archivo (aparece con "quiero subir un archivo") ===== -->
    <div class="upload-panel" id="uploadPanel" hidden>
      <button class="upload-close" id="uploadCloseBtn" title="Cerrar"><span class="ico" data-icon="close"></span></button>
      <div class="upload-icon"><span class="ico" data-icon="attach"></span></div>
      <div class="upload-title">Subí tu archivo</div>
      <div class="upload-sub">Arrastrá un archivo aquí o elegilo</div>
      <button class="upload-btn" id="uploadBtn">Elegir archivo</button>
    </div>

    <!-- ===== Panel de VIGILANCIA EN VIVO (SENTINEL) ===== -->
    <aside class="sentinel-panel" id="sentinelPanel">
      <div class="sp-head">
        <span class="sp-title"><span class="sp-pulse"></span>VIGILANCIA EN VIVO</span>
        <button class="sp-rescan" id="spRescan" title="Re-escanear ahora">↻</button>
      </div>
      <div class="sp-scorebox">
        <div class="sp-score" id="spScore">—</div>
        <div class="sp-scorelbl">PUNTAJE DE SEGURIDAD</div>
      </div>
      <div class="sp-summary" id="spSummary">Iniciando barrido…</div>
      <div class="sp-list" id="spList"></div>
    </aside>
  </div>

  <!-- Provided by Qt when embedded; harmlessly 404s in a plain browser -->
  <script src="qrc:///qtwebchannel/qwebchannel.js"></script>
  <script src="icons.js"></script>
  <script src="three.min.js"></script>
  <script src="orb_three.js"></script>
  <script src="sentinel_panel.js"></script>
  <script src="app.js"></script>
</body>
</html>
